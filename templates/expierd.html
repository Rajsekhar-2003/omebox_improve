<!-- templates/expired.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareBin - Content Expired</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #101011 0%, #764ba2 100%); min-height: 100vh; }
        .card { border-radius: 20px; overflow: hidden; }
        .card-header { background: #dc3545; color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 50px; padding: 12px 30px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">
                        <h2><i class="fas fa-exclamation-triangle me-2"></i>Content Unavailable</h2>
                    </div>
                    <div class="card-body p-4">
                        <i class="fas fa-clock fa-4x text-danger mb-3"></i>
                        <h4>{{ message }}</h4>
                        <p class="text-muted">The share link or code you used has expired or does not exist.</p>
                        <a href="/" class="btn btn-primary mt-3">
                            <i class="fas fa-plus-circle me-2"></i>Create New Share
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
