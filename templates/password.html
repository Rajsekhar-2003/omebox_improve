<!-- templates/password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>OmeBox - Password Protected</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', path='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='logo.png') }}">
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="YOUR_PUBLISHER_ID">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=YOUR_PUBLISHER_ID" crossorigin="anonymous"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            background: #F8FAFC; 
            min-height: 100vh; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card { 
            border-radius: 28px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            transition: transform 0.25s ease, box-shadow 0.3s;
            animation: fadeSlideUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .card-header { 
            background: linear-gradient(135deg, #2563EB, #1D4ED8); 
            color: white; 
            padding: 1.5rem;
            border-bottom: none;
        }
        
        .card-header h3 {
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .card-header p {
            opacity: 0.85;
            font-weight: 400;
        }
        
        .card-body { 
            padding: 2rem !important;
        }
        
        .password-input { 
            font-size: 20px; 
            letter-spacing: 4px; 
            text-align: center; 
            font-family: 'Courier New', monospace;
            font-weight: 600;
            background: #FFFFFF;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 14px 12px;
            color: #0F172A;
            transition: all 0.25s;
        }
        
        .password-input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            outline: none;
            background: #FFFFFF;
            letter-spacing: 6px;
        }
        
        .password-input::placeholder {
            color: #94A3B8;
            letter-spacing: 2px;
            font-weight: 400;
        }
        
        .btn-primary { 
            background: #2563EB; 
            border: none; 
            border-radius: 60px; 
            padding: 14px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .form-label {
            color: #0F172A;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .alert-danger {
            background: #FEF2F2;
            border-color: #FCA5A5;
            color: #991B1B;
            border-radius: 16px;
            padding: 12px 16px;
            font-weight: 500;
        }
        
        .alert-danger i {
            color: #EF4444;
        }
        
        /* Ad container */
        .ad-container {
            text-align: center;
            margin-bottom: 16px;
            padding: 8px;
            background: #F1F5F9;
            border-radius: 16px;
            border: 1px solid #E2E8F0;
        }
        
        .ad-label {
            font-size: 0.7rem;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .help-text {
            color: #64748B;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
        }
        
        .help-text a {
            color: #2563EB;
            text-decoration: none;
            font-weight: 500;
        }
        
        .help-text a:hover {
            text-decoration: underline;
        }
        
        .lock-icon {
            font-size: 3rem;
            color: #2563EB;
            margin-bottom: 12px;
            display: block;
        }
        
        /* Animation */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .card { 
                border-radius: 24px; 
            }
            .card-body { 
                padding: 1.5rem !important; 
            }
            .password-input {
                font-size: 18px;
                letter-spacing: 3px;
                padding: 12px 10px;
            }
            .password-input:focus {
                letter-spacing: 4px;
            }
            .card-header {
                padding: 1.2rem;
            }
            .card-header h3 {
                font-size: 1.3rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .card-body {
                padding: 1.2rem !important;
            }
            .password-input {
                font-size: 16px;
                letter-spacing: 2px;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
        
        /* Accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #2563EB;
            color: white;
            padding: 8px 16px;
            z-index: 9999;
            text-decoration: none;
            border-radius: 0 0 8px 0;
            font-weight: 500;
        }
        .skip-link:focus {
            top: 0;
            outline: none;
        }
        
        :focus-visible {
            outline: 3px solid #2563EB;
            outline-offset: 3px;
            border-radius: 12px;
        }
        
        /* Show/hide password toggle */
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        
        .password-wrapper .toggle-password:hover {
            color: #2563EB;
        }
        
        .password-wrapper .toggle-password:focus {
            outline: none;
            color: #2563EB;
        }
        
        .mt-2 {
            margin-top: 0.5rem;
        }
        
        .text-muted {
            color: #64748B !important;
        }
    </style>
</head>
<body>
<a href="#main-password-content" class="skip-link">Skip to main content</a>

<main id="main-password-content" tabindex="-1" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- Google Ad - Top -->
           

            <div class="card">
                <div class="card-header text-center">
                    <i class="fas fa-lock fa-2x mb-2 d-block" style="opacity: 0.8;"></i>
                    <h3 class="fw-bold mb-1"><i class="fas fa-shield-alt me-2"></i>Password Protected</h3>
                    <p class="mb-0">This share requires a password to access</p>
                </div>
                <div class="card-body">
                    
                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}
                    
                    <form method="post" action="/s/{{ share_id }}/verify" id="passwordForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="fas fa-key me-2" style="color: #2563EB;"></i>Enter Password
                            </label>
                            <div class="password-wrapper">
                                <input type="password" 
                                       name="password" 
                                       id="passwordInput" 
                                       class="form-control password-input" 
                                       placeholder="••••••••"
                                       required 
                                       autofocus>
                                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between mt-2">
                                <small class="text-muted">
                                    <i class="fas fa-info-circle me-1" style="color: #2563EB;"></i>Enter the password provided by the sender
                                </small>
                                <small class="text-muted" id="charCount">0 characters</small>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                            <i class="fas fa-unlock-alt me-2"></i>Access Content
                        </button>
                    </form>
                    
                    <div class="help-text mt-3">
                        <i class="fas fa-question-circle me-1" style="color: #2563EB;"></i>
                        Forgot the password? <a href="/access">Access with code</a> or <a href="/">create a new share</a>
                    </div>
                </div>
            </div>
            
            <!-- Google Ad - Bottom -->
            
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('passwordForm');
        
        // Character counter
        if (passwordInput && charCount) {
            passwordInput.addEventListener('input', function() {
                const len = this.value.length;
                charCount.textContent = len + ' characters';
                charCount.style.color = len === 0 ? '#64748B' : len < 4 ? '#F59E0B' : '#10B981';
            });
        }
        
        // Toggle password visibility
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
                
                // Update aria-label
                this.setAttribute('aria-label', type === 'password' ? 'Show password' : 'Hide password');
            });
        }
        
        // Form submission feedback
        if (form && submitBtn) {
            form.addEventListener('submit', function() {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verifying...';
            });
        }
        
        // Auto-focus on page load
        if (passwordInput) {
            passwordInput.focus();
        }
        
        // Enter key support
        if (passwordInput) {
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.length > 0) {
                    form.submit();
                }
            });
        }
        
        // Accessibility: announce error
        const errorAlert = document.querySelector('.alert-danger');
        if (errorAlert) {
            errorAlert.setAttribute('role', 'alert');
            errorAlert.setAttribute('aria-live', 'polite');
        }
    })();
</script>
</body>
</html>
