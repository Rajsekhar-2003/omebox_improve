# /etc/nginx/sites-available/omebox  -> symlink into sites-enabled
# Replace omebox.com with your real domain before enabling TLS.

server {
    listen 80;
    server_name omebox.com www.omebox.com;

    # Keep ACME challenge reachable when Certbot uses webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name omebox.com www.omebox.com;

    ssl_certificate     /etc/letsencrypt/live/omebox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omebox.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Uploads can be up to 100 MB/file and 500 MB/share (see .env).
    client_max_body_size 600M;
    client_body_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Let the app add CSP/HSTS; nginx only forwards the client address.
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;   # stream large downloads instead of buffering to RAM
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public";
    }
}
